name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify release source and version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node -e 'const { readFileSync } = require("node:fs"); const { version } = JSON.parse(readFileSync("package.json", "utf8")); const tag = process.env.GITHUB_REF_NAME; if (tag !== `v${version}`) throw new Error(`Release tag ${tag} must match package version ${version}.`);'

      - name: Run tests, including packed-install smoke test
        run: npm test

      - name: Verify generated guidance
        run: npm run check

      - name: Inspect publishable package
        run: npm pack --dry-run --json

      - name: Publish to npm
        run: npm publish
        env:
          # Required only for the first publish. Delete the repository secret
          # after configuring npm trusted publishing for publish.yml.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
